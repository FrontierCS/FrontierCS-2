[project]
name = "frontiercs-2-tooling"
version = "0.0.0"
description = "FrontierCS-2 deployment and task tooling"
requires-python = "==3.13.*"
dependencies = [
    "jsonschema>=4.23,<5",
    "pytest>=8,<10",
    "zstandard>=0.23,<1",
]

[dependency-groups]
dev = ["ruff==0.16.10", "PyYAML==6.0.3", "cryptography==41.0.7", "swebench==4.1.0", "numpy==2.5.4", "openai==3.13.0", "rank-bm25==0.2.2", "libclang==18.1.1"]

[tool.uv]
package = false

[tool.ruff]
include = ["scripts/**/*.py", "tests/**/*.py"]
extend-exclude = ["tasks", "tests/fixtures"]
cache-dir = ".tooling/ruff"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Compatibility entrypoints deliberately re-export their imported names.
"scripts/frontier_deploy.py" = ["F401"]
"scripts/reference_parity.py" = ["F401"]
# Bytecode writes are disabled before importing task modules.
"scripts/import_task.py" = ["E402"]
# Tests select local script modules before importing them.
"tests/*.py" = ["E402"]

[tool.ruff.lint.isort]
# The test guard is imported before any other module (tests/test_deployment_test_guard.py).
sections = { guard = ["deployment_test_guard"] }
section-order = ["future", "guard", "standard-library", "third-party", "first-party", "local-folder"]
