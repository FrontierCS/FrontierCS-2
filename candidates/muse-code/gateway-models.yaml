# Example LiteLLM routes for the Muse Code Candidate model aliases.
#
# Reference input for the operator's LiteLLM gateway; this file is not copied
# into the overlay image. Each model_name must equal the Candidate's model alias
# and a row id in model-catalog.json. The provider key stays in the gateway.
#
# supports_native_streaming must be true, otherwise LiteLLM fake-streams an
# unknown alias and fails to parse the SSE body.
model_list:
  - model_name: muse-spark-1.3
    litellm_params:
      model: openai/muse-spark-1.3
      api_base: https://api.meta.ai/v1
      api_key: os.environ/META_API_KEY
    model_info:
      mode: responses
      supports_native_streaming: true
      # Official Standard prices, Meta pricing documentation retrieved 2026-10-05:
      # $1.25 / M input, $0.15 / M cached input, $4.25 / M output.
      input_cost_per_token: 0.00000125
      cache_read_input_token_cost: 0.00000015
      output_cost_per_token: 0.00000425

  - model_name: muse-wonder-1.0
    litellm_params:
      model: openai/muse-wonder-1.0
      api_base: https://api.meta.ai/v1
      api_key: os.environ/META_API_KEY
    model_info:
      mode: responses
      supports_native_streaming: true
      # Documented context window (https://dev.meta.ai/docs/models.md, 2026-10-12).
      max_input_tokens: 1048576
      # Official Standard prices, retrieved 2026-10-13:
      # https://dev.meta.ai/docs/pricing-rate-limits.md
      # $4 / M input, $0.20 / M cached input, $20 / M output.
      input_cost_per_token: 0.000004
      cache_read_input_token_cost: 0.0000002
      output_cost_per_token: 0.00002
