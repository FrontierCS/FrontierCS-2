{
  "edit_scope": {
    "allow_delete": false,
    "allow_empty": false,
    "allow_executable": false,
    "allow_new_files": true,
    "allowed_paths": [
      "my_cond_branch_predictor.cc",
      "solver_extensions/"
    ],
    "allowed_suffixes": [],
    "deny_paths": [],
    "forbidden_added": [],
    "forbidden_content": [],
    "ignore_case": false,
    "max_changed_files": 50,
    "max_patch_bytes": 262144
  },
  "environment": {
    "cpus": 8
  },
  "evaluation": {
    "answering_timeout_seconds": 18000,
    "max_dev_submissions": 100,
    "max_metrics_bytes": 524288,
    "max_train_wall_seconds": 18000,
    "solver_visible_metrics": [
      "train_br_mis_pki_mean",
      "train_cyc_wp_pki_mean",
      "all_metrics_progress",
      "category_means",
      "candidate_failure"
    ]
  },
  "runtime": {
    "environment": {
      "memory_mb": 4096
    },
    "timeout_seconds": 7200
  }
}
