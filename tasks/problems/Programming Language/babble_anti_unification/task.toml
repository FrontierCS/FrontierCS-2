# The definition of babble_anti_unification (schema frontier.task/v1). Only what differs
# between tasks is here; tasks/shared/task-defaults.toml has the explicit defaults of the
# rest, and the category is this task's folder.
schema = "frontier.task/v1"
id = "babble_anti_unification"
display_name = "Reusable Library Candidates"
version = "native-standardization-1-agent5h-r2-task-toml"

[agent]
cpu_millis = 2000
memory_bytes = 8589934592         # 8 GiB
workspace_bytes = 4294967296      # 4 GiB

[verifier]
cpu_millis = 2000
memory_bytes = 2147483648         # 2 GiB

[quota]
wall_time_seconds = 18000         # 5 h
max_train_calls = 100
max_train_wall_seconds = 1800
eval_timeout_seconds = 600

[submission]
max_bytes = 262144
allowed_paths = ["src/learn.rs", "src/dfta.rs", "src/learn_extensions/"]
max_changed_files = 20            # the statement's limit, unchanged by the migration
# The statement's forbidden substrings of added lines, checked case-insensitively as before
# (the reference adds none of them).
ignore_case = true
forbidden_added = [
    'std::time', 'option_env!', 'env!', 'unsafe', 'libc', 'asm!', 'frontier_', 'harbor_',
    'process::exit', 'tcpstream', 'udpstream',
]

[feedback]                        # Agent-visible train metrics, in display order
compression_ratio = "The candidate's compression ratio (initial / final AST cost) for each development corpus, in suite order."
runtime_seconds = "The candidate's median end-to-end benchmark runtime for each development corpus, in seconds, in suite order."

[paper]                           # for readers; the platform never reads it
title = "babble: Learning Better Abstractions with E-Graphs and Anti-unification"
venue = "POPL 2023"
url = "https://arxiv.org/abs/2212.04596"
summary = "Improve BABBLE's library learning so refactored program corpora become smaller."
