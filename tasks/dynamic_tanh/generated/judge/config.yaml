{
  "edit_scope": {
    "allow_delete": false,
    "allow_empty": false,
    "allow_executable": false,
    "allow_new_files": true,
    "allowed_paths": [
      "dynamic_tanh.py",
      "solver_extensions/"
    ],
    "allowed_suffixes": [],
    "deny_paths": [],
    "forbidden_added": [],
    "forbidden_content": [
      "argv|__main__|\\binspect\\b|_getframe|currentframe|f_back|f_globals|f_locals|f_code|\\btraceback\\b|getpid|getppid|/proc|environ|getenv|sys\\.modules|cmdline|program_invocation"
    ],
    "ignore_case": true,
    "max_changed_files": 32,
    "max_patch_bytes": 262144
  },
  "evaluation": {
    "answering_timeout_seconds": 18000,
    "max_dev_submissions": 3,
    "max_metrics_bytes": 524288,
    "max_train_wall_seconds": 2700,
    "solver_visible_metrics": [
      "top1_accuracy_pct",
      "training_latency_ms",
      "inference_latency_ms"
    ]
  },
  "runtime": {
    "timeout_seconds": 1800
  }
}
