{
  "edit_scope": {
    "allow_delete": false,
    "allow_empty": true,
    "allow_executable": false,
    "allow_new_files": false,
    "allowed_paths": [
      "solution.json"
    ],
    "allowed_suffixes": [],
    "deny_paths": [],
    "forbidden_added": [],
    "forbidden_content": [],
    "ignore_case": false,
    "max_changed_files": 1,
    "max_file_bytes": 2000000,
    "max_patch_bytes": 4194304
  },
  "evaluation": {
    "answering_timeout_seconds": 18000,
    "max_dev_submissions": 100,
    "max_metrics_bytes": 524288,
    "max_train_wall_seconds": 12000,
    "solver_visible_metrics": [
      "instance_count",
      "solved_count",
      "submitted_count",
      "invalid_count",
      "duplicate_count",
      "conflict_count",
      "unknown_count",
      "rejection_code_counts"
    ]
  },
  "runtime": {
    "timeout_seconds": 120
  }
}
