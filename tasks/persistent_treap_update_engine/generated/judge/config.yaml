{
  "edit_scope": {
    "allow_delete": false,
    "allow_empty": false,
    "allow_executable": false,
    "allow_new_files": false,
    "allowed_paths": [
      "lib/treap/scheduler.hpp",
      "lib/treap/search_insert.hpp",
      "lib/treap/search_delete.hpp"
    ],
    "allowed_suffixes": [],
    "deny_paths": [],
