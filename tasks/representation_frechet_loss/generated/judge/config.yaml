{
  "edit_scope": {
    "allow_delete": false,
    "allow_empty": false,
    "allow_executable": false,
    "allow_new_files": true,
    "allowed_paths": [
      "frechet_distance/queue.py",
      "frechet_distance/frontier_solution/"
