{
  "edit_scope": {
    "allow_delete": false,
    "allow_empty": false,
    "allow_executable": false,
    "allow_new_files": false,
    "allowed_paths": [
      "lib/evmcow/execution_state.hpp"
    ],
    "allowed_suffixes": [],
    "deny_paths": [],
    "forbidden_added": [
      "\\#define",
      "malloc",
      "calloc",
      "realloc",
      "aligned_alloc",
      "mmap",
      "sbrk",
      "operator\\ new",
      "operator\\ delete",
      "Statistics",
      "checkpoint_bench",
      "FRONTIER_",
      "mallctl",
      "jemalloc"
    ],
    "forbidden_content": [],
    "ignore_case": true,
    "max_changed_files": 1,
    "max_patch_bytes": 65536
  },
  "evaluation": {
    "answering_timeout_seconds": 18000,
    "max_dev_submissions": 100,
    "max_metrics_bytes": 524288,
    "max_train_wall_seconds": 360000,
    "solver_visible_metrics": [
      "committed_tps",
      "checkpoint_create_ns",
      "checkpoint_restore_ns",
      "retained_bytes_per_checkpoint"
    ]
  },
  "runtime": {
    "timeout_seconds": 3600
  }
}
