{
  "edit_scope": {
    "allow_delete": false,
    "allow_empty": false,
    "allow_executable": false,
    "allow_new_files": true,
    "allowed_paths": [
      "sql_testing/environment.py",
      "sql_testing/smt/formula.py",
      "sql_testing/smt/knowledgebase.py",
      "sql_testing/smt/search_extensions/"
    ],
    "allowed_suffixes": [],
    "deny_paths": [],
    "forbidden_added": [],
    "forbidden_content": [],
    "ignore_case": false,
    "max_changed_files": 20,
    "max_patch_bytes": 262144
  },
  "evaluation": {
    "answering_timeout_seconds": 18000,
    "max_dev_submissions": 100,
    "max_metrics_bytes": 524288,
    "max_train_wall_seconds": 12000,
    "solver_visible_metrics": [
      "refuted_pairs",
      "wall_time_seconds",
      "search_iterations",
      "backtracks"
    ]
  },
  "runtime": {
    "timeout_seconds": 1800
  }
}
