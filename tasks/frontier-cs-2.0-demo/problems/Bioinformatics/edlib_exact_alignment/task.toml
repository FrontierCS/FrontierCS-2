# The definition of edlib_exact_alignment (schema frontier.task/v1, #757). Only what differs
# between tasks is here; tasks/shared/task-defaults.toml has the explicit defaults of the
# rest, and the category is this task's folder.
schema = "frontier.task/v1"
id = "edlib_exact_alignment"
display_name = "Exact Sequence Alignment"
version = "r007-validated-timing-two-metric-gate"

[agent]
cpu_millis = 2000
memory_bytes = 4294967296         # 4 GiB
workspace_bytes = 5368709120      # 5 GiB

[verifier]
cpu_millis = 2000
memory_bytes = 4294967296         # 4 GiB

[quota]
wall_time_seconds = 18000         # 5 h
max_train_calls = 20
max_train_wall_seconds = 12000
eval_timeout_seconds = 600

[submission]
max_bytes = 262144
allowed_paths = ["edlib/src/edlib.cpp"]
max_changed_files = 1             # unchanged by the migration; the Agent sees it in submission-policy.json

[paper]                           # for readers; the platform never reads it
title = "Edlib: a C/C++ library for fast, exact sequence alignment using edit distance"
venue = "Bioinformatics 2017"
url = "https://doi.org/10.1093/bioinformatics/btw753"
summary = "Speed up exact edit-distance sequence alignment in the Edlib C++ library."
