# The definition of hypergraph_core_numbers (schema frontier.task/v1, #757). Only what differs
# between tasks is here; tasks/shared/task-defaults.toml has the explicit defaults of the
# rest, and the category is this task's folder.
schema = "frontier.task/v1"
id = "hypergraph_core_numbers"
display_name = "Hypergraph Core Numbers"
version = "native-transfer-4-framework-first-build-task-toml"

[agent]
cpu_millis = 8000
memory_bytes = 4294967296         # 4 GiB
workspace_bytes = 2147483648      # 2 GiB

[verifier]
cpu_millis = 8000
memory_bytes = 4294967296         # 4 GiB

[quota]
wall_time_seconds = 18000         # 5 h
max_train_calls = 100
max_train_wall_seconds = 30000
eval_timeout_seconds = 1800

[submission]
max_bytes = 262144
allowed_paths = ["apps/hyper/HyperKCore-Efficient.C", "apps/hyper/frontier_solution/"]
max_changed_files = 20            # the statement's limit, unchanged by the migration

[feedback]                        # Agent-visible train metrics, in display order
candidate_runtime_seconds_median = "Median over the development workloads of the candidate's seven-run median eight-thread complete-process runtime, in seconds."
candidate_sequential_runtime_seconds_median = "The same median for one-thread runs, in seconds; null if any one-thread run failed."

[paper]                           # for readers; the platform never reads it
title = "Practical Parallel Hypergraph Algorithms"
venue = "PPoPP 2020"
url = "https://people.csail.mit.edu/jshun/hygra.pdf"
summary = "Speed up hypergraph k-core decomposition in the Hygra/Ligra framework."
