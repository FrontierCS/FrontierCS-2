tag: systems
runtime:
  language: python
  timeout_seconds: 1800
  environment: "Python 3.12; original trace-driven Gavel simulator; CVXPY and restricted-license Gurobi on CPU"
  apt_packages: [build-essential, git, python3, python3-pip, python3-venv]
  judge_apt_packages: [build-essential, git, python3, python3-pip, python3-venv]
  pip_packages:
    - cvxpy==1.9.2
    - grpcio==1.83.1
    - grpcio-tools==1.83.1
    - gurobipy==13.0.3
    - matrix-completion==0.0.2
    - mosek==11.2.3
    - numpy==2.5.2
    - psutil==7.2.2
    - scikit-learn==1.9.0
    - scipy==1.18.1
  judge_pip_packages:
    - cvxpy==1.9.2
    - grpcio==1.83.1
    - grpcio-tools==1.83.1
    - gurobipy==13.0.3
    - matrix-completion==0.0.2
    - mosek==11.2.3
    - numpy==2.5.2
    - psutil==7.2.2
    - PyYAML==6.0.3
    - scikit-learn==1.9.0
    - scipy==1.18.1
  docker:
    image: ubuntu:24.04
environment:
  cpus: 4
  memory_mb: 4096
  storage_mb: 4096
  build_timeout_seconds: 900
evaluation:
  max_dev_submissions: 3
  suite_relation: same_distribution
  solver_visible_metrics:
    - makespan_seconds
    - average_jct_seconds
    - worst_finish_time_fairness_rho
    - unfair_job_fraction_percent
  cluster_spec: "4:0:0"
  num_gpus_per_server: "1:1:1"
  seed: 0
  time_per_iteration: 120
  workload_timeout_seconds: 240
  makespan_scale_seconds: 12000.0
  average_jct_scale_seconds: 7000.0
  fairness_numerator_rho: 0.55
  fairness_offset_rho: 0.05
  unfair_threshold_rho: 1.05
  makespan_weight: 40.0
  average_jct_weight: 40.0
  worst_fairness_weight: 15.0
  unfair_fraction_weight: 5.0
submission:
  kind: patch
  path: /app/solution.patch
  repo_root: /app
  allow_paths:
    - scheduler/shockwave.py
    - scheduler/shockwave_helper.py
    - scheduler/solver_extensions/
  max_changed_files: 20
  max_patch_bytes: 262144
