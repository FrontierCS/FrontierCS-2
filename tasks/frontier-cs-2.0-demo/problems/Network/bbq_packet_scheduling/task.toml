# The definition of bbq_packet_scheduling (schema frontier.task/v1, #757). Only what differs
# between tasks is here; tasks/shared/task-defaults.toml has the explicit defaults of the
# rest, and the category is this task's folder.
schema = "frontier.task/v1"
id = "bbq_packet_scheduling"
display_name = "BBQ bitmap traversal"
version = "s2r11_clock-period-r3"

[agent]
cpu_millis = 2000
memory_bytes = 4294967296         # 4 GiB
workspace_bytes = 17179869184     # 16 GiB

[verifier]
cpu_millis = 2000
memory_bytes = 4294967296         # 4 GiB

[quota]
wall_time_seconds = 18000         # 5 h
max_train_calls = 100
max_train_wall_seconds = 60000
eval_timeout_seconds = 1800

[submission]
# The archive limit the Agent was told (8 MiB). The old judge's patch checker capped the
# patch at its 256 KiB default; the migration takes the told value (owner rule, #757).
max_bytes = 8388608
allowed_paths = ["hardware/bbq/generator/bbq_level_lx.py",
                 "hardware/bbq/generator/solver_extensions/"]

# Agent-visible train metrics.
[feedback]
dev_min_throughput_ops_per_second = "Minimum candidate throughput over the public train workloads, in operations per second; 0 if any workload is invalid."
dev_max_latency_picoseconds = "Maximum candidate worst response latency (cycles times clock period) over the public train workloads, in picoseconds; -1 if any workload is invalid."
dev_max_clock_period_picoseconds = "Maximum candidate modelled clock period over the public train configurations, in picoseconds; -1 if any workload is invalid."
dev_min_throughput_ops_per_cycle = "Minimum candidate completed operations per simulated cycle over the public train workloads; 0 if any workload is invalid."
dev_max_latency_cycles = "Maximum candidate worst response latency over the public train workloads, in simulated cycles; -1 if any workload is invalid."
dev_valid_fraction = "Fraction of the public train workloads that are fully correct."

[paper]                           # for readers; the platform never reads it
title = "BBQ: A Fast and Scalable Integer Priority Queue for Hardware Packet Scheduling"
venue = "NSDI 2024"
url = "https://www.usenix.org/system/files/nsdi24-atre.pdf"
summary = "Improve the BBQ hardware integer priority queue generator's bitmap traversal for packet scheduling."
