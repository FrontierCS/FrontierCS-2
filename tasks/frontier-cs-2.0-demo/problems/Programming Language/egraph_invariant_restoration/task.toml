# The definition of egraph_invariant_restoration (schema frontier.task/v1). Only what
# differs between tasks is here; tasks/shared/task-defaults.toml has the explicit defaults of
# the rest, and the category is this task's folder.
schema = "frontier.task/v1"
id = "egraph_invariant_restoration"
display_name = "E-Graph Invariant Restoration"
version = "native-transfer-1-beat-spec-v2-task-toml"

[agent]
cpu_millis = 8000
memory_bytes = 4294967296         # 4 GiB
workspace_bytes = 4294967296      # 4 GiB

[verifier]
cpu_millis = 8000
memory_bytes = 4294967296         # 4 GiB

[quota]
wall_time_seconds = 18000         # 5 h
max_train_calls = 100
max_train_wall_seconds = 120000
eval_timeout_seconds = 1800

[submission]
# The archive limit the Agent was told (1 MiB). The old judge also capped the patch itself at
# 262,144 bytes; the shared edit scope caps the patch at the archive limit, as decided for
# every task whose limits disagreed (owner, 2026-11-04).
max_bytes = 1048576
allowed_paths = [
    "src/egraph.rs",
    "src/tutorials/_01_background.rs",
    "src/tutorials/mod.rs",
    "src/solver_extensions/",
]
max_changed_files = 20            # the statement's limit, unchanged by the migration

[feedback]                        # Agent-visible train metrics, in display order
candidate_dev_wall_clock_seconds_median = "Median over the development workloads of the candidate's median per-process wall-clock time, in seconds."
candidate_dev_congruence_seconds_median = "Median over the development workloads of the candidate's median congruence-maintenance (apply + rebuild) time, in seconds."

[paper]                           # for readers; the platform never reads it
title = "egg: Fast and Extensible Equality Saturation"
venue = "POPL 2021"
url = "https://arxiv.org/pdf/2004.03082"
summary = "Speed up invariant restoration (rebuilding) in the egg e-graph library."
