# The definition of kami_fp64_block_gemm (schema frontier.task/v1). Only what differs
# between tasks is here; tasks/shared/task-defaults.toml has the explicit defaults of the
# rest, and the category is this task's folder.
#
# GPU task: the Agent has one H100 runner (docker/agent-gpu.Dockerfile) and the Verifier runs
# the judge on one H100 (docker/verifier-gpu.Dockerfile) through the shared GPU adapter.
schema = "frontier.task/v1"
id = "kami_fp64_block_gemm"
display_name = "KAMI FP64 Block GEMM — trusted batched harness adaptation"
version = "native-standard-v1"

[agent]
cpu_millis = 3000
memory_bytes = 4294967296         # 4 GiB
workspace_bytes = 4294967296      # 4 GiB

[verifier]
cpu_millis = 3000
memory_bytes = 4294967296         # 4 GiB

[quota]
wall_time_seconds = 18000         # 5 h
max_train_calls = 12
max_train_wall_seconds = 21600
eval_timeout_seconds = 1800

# The CUDA source (only its device region may change: the judge's check_tree) and new or
# changed files below solver_extensions/.
[submission]
max_bytes = 262144
allowed_paths = ["src/block_gemm/KAMI/1d/fp64/block_gemm_1d_double_mma.cu",
                 "src/block_gemm/KAMI/1d/fp64/solver_extensions/"]
max_changed_files = 12            # as before

[gpu.agent]
allowed_types = ["H100"]
max_gpu_seconds = 900
max_instance_seconds = 900
max_instances = 1

[gpu.verifier]
max_gpu_instances = 1
max_gpu_seconds = 1800

[accelerator]
agent_gpu_interface = "frontier.gpu-helper/v3"
agent_gpu_operations = "candidate-owned-generic-cli"
agent_sandbox = true
allowed_types = ["H100"]
credential_reaches_agent = false
provider = "driver-managed"
verifier_gpu = true

# SSH sessions to the GPU runners, per role (they must sum to max_ssh_sessions).
[network.audit]
max_ssh_sessions = 1050
ssh_session_budgets = { agent = 1024, verifier_train = 24, verifier_eval = 2 }

[paper]                           # for readers; the platform never reads it
title = "KAMI: Communication-Avoiding General Matrix Multiplication within a Single GPU"
venue = "SC 2025"
url = "https://www.ssslab.cn/assets/papers/2025-wang-KAMI.pdf"
summary = "Implement the missing FP64 KAMI tensor-core block-GEMM device kernel on one H100."

# What a train result returns to the Agent besides score_unbounded, beat_spec_progress and
# rejected (tasks/shared/task-defaults.toml).
[feedback]
tflops = "Candidate crossover-adjusted validated batched throughput per train workload, in TFLOPS; an array in suite order, without workload labels."
