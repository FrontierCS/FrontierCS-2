# The definition of clusterwise_spgemm (schema frontier.task/v1). Only what differs
# between tasks is here; tasks/shared/task-defaults.toml has the explicit defaults of the
# rest, and the category is this task's folder.
schema = "frontier.task/v1"
id = "clusterwise_spgemm"
display_name = "Fixed-Length Clustered Sparse Multiplication"
version = "g2-separate-kernel-build"

[agent]
cpu_millis = 2000
memory_bytes = 17179869184        # 16 GiB
workspace_bytes = 34359738368     # 32 GiB

[verifier]
cpu_millis = 60000                # the platform schedules it on the large-CPU pool
memory_bytes = 68719476736        # 64 GiB

[quota]
wall_time_seconds = 18000         # 5 h
max_train_calls = 3
max_train_wall_seconds = 21600
eval_timeout_seconds = 7200

[submission]
# The Agent was told 266,240 bytes (the archive cap, also its pre-check's patch cap); the judge
# enforced 262,144 on the patch. The told value is kept for both (owner rule).
max_bytes = 266240
allowed_paths = [
    "CSR_FlengthCluster.h",
    "BIN_FlengthCluster.h",
    "hash_mult_flengthcluster.h",
    "hash_mult.h",
    "cluster_utility.h",
    "CSR_VlengthCluster.h",
    "BIN.h",
    "frontier_solution/",
]
max_changed_files = 24            # unchanged by the migration; the Agent sees it in submission-policy.json

# The judge's own measurement constants (config.yaml, read by judge/runtime_context.py). The
# environment block restates the Verifier and Agent resources above, which RuntimeLimits checks
# against the cgroup; dataset_objects pins the two dataset tars the loader verifies.
[judge.config.benchmark]
child_address_space_mb = 49152
cluster_width = 8
evaluator_reserve_seconds = 60
max_expanded_input_nnz = 40000000
max_matrix_rows = 4000000
max_oracle_product_nnz = 80000000
max_product_bytes = 7516192768
max_scalar_operations = 2000000000
pairs = 7
process_wall_seconds = 180
reference_max_median_drift = 0.05
reference_max_relative_mad = 0.05
strict_time_ratio = 0.85

[judge.config.environment]
cpus = 60
memory_mb = 65536
storage_mb = 32768
build_timeout_seconds = 600
agent = { cpus = 2, memory_mb = 16384 }

[judge.config.dataset_objects.train]
bytes = 525844480
media_type = "application/x-tar"
path = "datasets/train.tar"
version = "sha256:e7d56702e8a5050bd473adf789d99813dfe0e9d3ee3b9b7b5388530e4148940e"

[judge.config.dataset_objects.eval]
bytes = 902113280
media_type = "application/x-tar"
path = "datasets/eval.tar"
version = "sha256:c93be05b1a9299cb21f346cb6e7afb1c05e30d8f43902d0a8ff1a06a459288b5"

# What train returns to the Agent beside beat_spec_progress, one neutral sentence each.
[feedback]
candidate_median_execution_time_ms = "Median over the development workloads of the median measured execution time, in milliseconds."
candidate_median_throughput_mflops = "Median over the development workloads of the derived throughput, in MFLOPS."
candidate_max_output_bytes = "Largest captured product over all development runs, in bytes."

[paper]                           # for readers; the platform never reads it
title = "Improving SpGEMM Performance Through Matrix-Reordering and Cluster-wise Computation"
venue = "SC 2025"
url = "https://arxiv.org/pdf/2507.21253v1"
summary = "Reconstruct and speed up fixed-length clustered sparse matrix-matrix multiplication (SpGEMM)."
