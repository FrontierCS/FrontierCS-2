# The definition of quarter_pir (schema frontier.task/v1, #757). Only what differs between tasks
# is here; tasks/shared/task-defaults.toml has the explicit defaults of the rest, and the
# category is this task's folder.
schema = "frontier.task/v1"
id = "quarter_pir"
display_name = "Private Set List Decoding"
version = "g1-r12-full-compute-scope-storage-gate-20261011"

[agent]
cpu_millis = 4000
memory_bytes = 8589934592         # 8 GiB
workspace_bytes = 8589934592      # 8 GiB

[verifier]
cpu_millis = 4000
memory_bytes = 8589934592         # 8 GiB
# The judge's private per-query measurements of a final (two experiments) are about 750 KB; the
# old verifier allowed 3 MiB.
max_metrics_bytes = 3145728

[quota]
wall_time_seconds = 18000         # 5 h
max_train_calls = 8
max_train_wall_seconds = 48000
eval_timeout_seconds = 6000

[submission]
# The archive limit the Agent was told (1 MiB); the old judge capped the patch at 512 KiB.
max_bytes = 1048576
allowed_paths = ["quarter_pir/code/pir/"]

# Judge-only settings of the evaluator (config.yaml).
[judge.config]
environment = { build_timeout_seconds = 600 }

# Agent-visible train metrics.
[feedback]
candidate_public_server_compute_time_ns_median = "Median candidate server compute time over the 1,000 measured queries of the train experiment, in nanoseconds; -1 when unavailable."
candidate_public_online_time_ms_median = "Candidate end-to-end online time of the train experiment, in milliseconds per query; -1 when unavailable."
candidate_public_preprocessing_seconds_large = "Candidate client preprocessing time of the train experiment, in seconds; -1 when unavailable."
candidate_public_online_communication_bytes_large = "Candidate mean request-plus-response bytes per query in the train experiment; -1 when unavailable."
candidate_public_client_storage_bytes_large = "Candidate client storage in the train experiment (the larger of the peak live heap readings), in bytes; -1 when unavailable."
candidate_public_validity_code = "First failed check: 0 valid; 3 build; 4 client crashed, broke the harness protocol or timed out; 5 hint export differs; 6 request is not the reduction of the reference request; 7 wrong retrieved value or failed server call; 8 client process memory limit; 9 server replay check; 10 evaluation time limit; 11 failed an additional query; 12 primary-hint audit failed; -1 no verdict (codes 1 and 2 are now shared rejections)."

[paper]                           # for readers; the platform never reads it
title = "Efficient Pre-processing PIR Without Public-Key Cryptography"
venue = "EUROCRYPT 2024"
url = "https://eprint.iacr.org/2023/1574"
summary = "Reduce per-query communication in QuarterPIR, a preprocessing private-information-retrieval scheme with client-side hints."
