tag: machine_learning_systems
runtime:
  language: python
  timeout_seconds: 1800
  environment: "Python 3.12, PyTorch 2.5.1, torchvision 0.20.1, timm 1.0.15, NumPy 2.1.3, Pillow 11.0.0; one NVIDIA A100 80GB"
  pip_packages:
    - torch==2.5.1
    - torchvision==0.20.1
    - timm==1.0.15
    - tensorboard==2.18.0
    - numpy==2.1.3
    - pillow==11.0.0
  apt_packages:
    - git
    - build-essential
    - python3-dev
  judge_pip_packages:
    - torch==2.5.1
    - torchvision==0.20.1
    - timm==1.0.15
    - tensorboard==2.18.0
    - numpy==2.1.3
    - pillow==11.0.0
  judge_apt_packages:
    - git
    - build-essential
    - python3-dev
  docker:
    image: ubuntu:24.04
  accelerator:
    provider: modal
    gpu_types: [A100-80GB]
    agent:
      instances: 1
      max_instance_seconds: 900
      max_gpu_seconds: 1800
    verifier:
      instances: 1
      max_instance_seconds: 1800
      max_gpu_seconds: 4500
environment:
  cpus: 3
  memory_mb: 12288
  storage_mb: 10240
  build_timeout_seconds: 300
submission:
  kind: patch
  path: /app/solution.patch
  repo_root: /app
  allow_paths:
    - dynamic_tanh.py
    - solver_extensions/
  max_changed_files: 32
  max_patch_bytes: 262144
evaluation:
  max_dev_submissions: 3
  suite_relation: same_distribution
  solver_visible_metrics:
    - top1_accuracy_pct
    - training_latency_ms
    - inference_latency_ms
    - candidate_diagnostic
