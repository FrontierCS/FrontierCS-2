# The definition of flow_opd (schema frontier.task/v1). Only what differs between tasks
# is here; tasks/shared/task-defaults.toml has the explicit defaults of the rest, and the
# category is this task's folder.
#
# GPU task: the Agent has one H100 runner (docker/agent-gpu.Dockerfile) and the Verifier runs
# the judge on one H100 (docker/verifier-gpu.Dockerfile) through the shared GPU adapter.
schema = "frontier.task/v1"
id = "flow_opd"
display_name = "OCR Distillation Trajectory Sampling"
version = "ceiling-aware-gate-source-closure-20261011"

[agent]
cpu_millis = 3000
memory_bytes = 12884901888        # 12 GiB
workspace_bytes = 10737418240     # 10 GiB

[verifier]
cpu_millis = 3000
memory_bytes = 12884901888        # 12 GiB

[quota]
wall_time_seconds = 18000         # 5 h
max_train_calls = 4
max_train_wall_seconds = 12000
eval_timeout_seconds = 3000

[submission]
max_bytes = 262144
allowed_paths = ["flow_grpo/diffusers_patch/sd3_pipeline_with_logprob.py",
                 "flow_grpo/diffusers_patch/sd3_sde_with_logprob.py",
                 "flow_grpo/frontier_solution/"]
max_changed_files = 32            # as before; the Agent's submission tool enforced the same
# Only the bodies of pipeline_with_logprob and sde_step_with_logprob may change in the two
# retained modules: judge/evaluator.py check_tree.

[gpu.agent]
allowed_types = ["H100"]
max_gpu_seconds = 3000
max_instance_seconds = 3000
max_instances = 1

[gpu.verifier]
max_gpu_instances = 1
max_gpu_seconds = 15000

[accelerator]
agent_gpu_interface = "frontier.gpu-helper/v3"
agent_sandbox = true
allowed_types = ["H100"]
credential_reaches_agent = false
provider = "driver-managed"
verifier_gpu = true

# SSH sessions to the GPU runners, per role (they must sum to max_ssh_sessions).
[network.audit]
max_ssh_sessions = 52
ssh_session_budgets = { agent = 32, verifier_train = 16, verifier_eval = 4 }

[paper]                           # for readers; the platform never reads it
title = "Flow-OPD: On-Policy Distillation for Flow Matching Models"
venue = "arXiv 2026"
url = "https://arxiv.org/abs/2605.08063"
summary = "Implement the trajectory sampler and SDE step with log-probabilities for on-policy distillation of a flow-matching text-to-image model."

[feedback]
dev_eval_reward_ocr = "Candidate mean OCR reward, in [0, 1], over the public development workloads after the train run; null if the run did not complete."
dev_verified_optimizer_updates = "Number of actual, non-skipped optimizer updates verified in the train run, also reported on failure."
