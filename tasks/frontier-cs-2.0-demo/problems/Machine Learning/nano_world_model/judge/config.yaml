tag: world_models
runtime:
  language: python
  timeout_seconds: 10200
  environment: "Python 3.11 with PyTorch 2.4.1 and one NVIDIA A10G; authentic NanoWM Point Maze checkpoint evaluation"
  apt_packages: [bash, git, python3]
  judge_apt_packages: [bash, git, python3, libseccomp2]
  pip_packages: &python_packages
    - torch==2.4.1
    - torchvision==0.19.1
    - numpy==1.26.4
    - scipy==1.13.1
    - Pillow==10.4.0
    - tqdm==4.66.5
    - requests==2.32.3
    - timm==1.0.9
    - einops==0.8.0
    - lpips==0.1.4
    - piqa==1.3.2
    - pytorch-lightning==1.9.5
    - torchmetrics==0.11.4
    - diffusers==0.30.3
    - accelerate==0.33.0
    - transformers==4.36.2
    - huggingface-hub==0.34.4
    - omegaconf==2.3.0
    - hydra-core==1.3.2
    - tensorboard==2.17.1
    - wandb==0.17.8
    - decord==0.6.0
    - h5py==3.11.0
    - pandas==2.2.2
    - opencv-python-headless==4.10.0.84
    - imageio==2.35.1
    - imageio-ffmpeg==0.5.1
    - moviepy==1.0.3
    - scikit-image==0.24.0
    - av==12.3.0
    - pytorch-fid==0.3.0
    - safetensors==0.4.5
    - PyYAML==6.0.2
  judge_pip_packages: *python_packages
  docker:
    image: ubuntu:24.04
    gpu_image: pytorch/pytorch:2.4.1-cuda12.4-cudnn9-runtime@sha256:0a3b9fedefe1f61ac4d5a9de9015c0863db27ca0fde2d4e37e6268147980b726
  accelerator:
    provider: modal
    gpu_types: [A10G]
    agent:
      instances: 1
      max_instance_seconds: 1800
      max_gpu_seconds: 1800
    verifier:
      instances: 1
      max_instance_seconds: 10200
      max_gpu_seconds: 20400
  huggingface_models:
    - repo_id: knightnemo/nanowm-b2-dino-wm-point-maze-30k
      revision: b84303b7151cbd1836841c3a87bf095e1015b150
      target: point-maze
    - repo_id: stabilityai/sd-vae-ft-mse
      revision: 31f26fdeee1355a5c34592e401dd41e45d25a493
      target: sd-vae
  torchvision_models: [vgg16-imagenet1k-v1]
environment:
  cpus: 3
  memory_mb: 12288
  storage_mb: 10240
  build_timeout_seconds: 600
evaluation:
  max_dev_submissions: 3
  suite_relation: same_distribution
  solver_visible_metrics: [psnr, ssim, lpips]
submission:
  kind: patch
  path: /app/solution.patch
  repo_root: /app
  allow_paths:
    - src/diffusion/df_sample.py
    - src/diffusion/gaussian_diffusion.py
    - src/diffusion/flow_matching.py
    - src/diffusion/frontier_solution/
  max_changed_files: 20
  max_patch_bytes: 262144
