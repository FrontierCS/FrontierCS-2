# The definition of detok_latent_denoising (schema frontier.task/v1). Only what differs
# between tasks is here; tasks/shared/task-defaults.toml has the explicit defaults of the rest,
# and the category is this task's folder.
#
# GPU task: the Agent has one A100-80GB runner (docker/agent-gpu.Dockerfile) and the Verifier
# runs the judge on one A100-80GB (docker/verifier-gpu.Dockerfile) through the shared GPU
# adapter (docker/verifier.Dockerfile). Both GPU images rebuild the task's dependency base from
# docker/dependency-base/ (hash-locked wheels and LFS model assets).
schema = "frontier.task/v1"
id = "detok_latent_denoising"
display_name = "Robust Image Tokenizer"
version = "g1"

[agent]
cpu_millis = 3000
memory_bytes = 12884901888        # 12 GiB
workspace_bytes = 10737418240     # 10 GiB

[verifier]
cpu_millis = 3000
memory_bytes = 12884901888        # 12 GiB

[quota]
wall_time_seconds = 18000         # 5 h
max_train_calls = 6
max_train_wall_seconds = 32400
eval_timeout_seconds = 5400

[submission]
max_bytes = 262144
allowed_paths = ["models/detok.py", "models/autoencoder.py", "models/frontier_solution/"]
max_changed_files = 20            # as before; the statement tells the Agent the same

[gpu.agent]
allowed_types = ["A100-80GB"]
max_gpu_seconds = 5400
max_instance_seconds = 5400
max_instances = 1

[gpu.verifier]
max_gpu_instances = 1
max_gpu_seconds = 5400

[accelerator]
agent_gpu_interface = "frontier.gpu-helper/v3"
agent_sandbox = true
allowed_types = ["A100-80GB"]
credential_reaches_agent = false
provider = "driver-managed"
verifier_gpu = true

# SSH sessions to the GPU runners, per role (they must sum to max_ssh_sessions).
[network.audit]
max_ssh_bytes_per_direction = 8388608   # 8 MiB, as before
max_ssh_sessions = 60
ssh_session_budgets = { agent = 32, verifier_train = 24, verifier_eval = 4 }

[feedback]                        # train metrics besides beat_spec_progress; each a mean over the development workloads
development_mean_ordinary_quantized_png_psnr_db = "Candidate ordinary-model PSNR after PNG quantization, in dB; mean over workloads."
development_mean_ema_quantized_png_psnr_db = "Candidate EMA-model PSNR after PNG quantization, in dB; mean over workloads."
development_mean_ordinary_quantized_png_lpips = "Candidate ordinary-model LPIPS (v0.1, VGG16) after PNG quantization, unitless; mean over workloads."
development_mean_ema_quantized_png_lpips = "Candidate EMA-model LPIPS (v0.1, VGG16) after PNG quantization, unitless; mean over workloads."
development_mean_method_process_wall_seconds = "Candidate complete method-process wall time, in seconds; mean over workloads."

[paper]                           # for readers; the platform never reads it
title = "Latent Denoising Makes Good Tokenizers"
venue = "ICLR 2026"
url = "https://arxiv.org/abs/2507.15856"
summary = "Train a more robust image tokenizer by denoising latent tokens."
