environment:
  cpus: 3
  memory_mb: 12288
  storage_mb: 10240
  build_timeout_seconds: 600
submission:
  kind: patch
  path: /app/solution.patch
  allow_paths:
  - models/detok.py
  - models/autoencoder.py
  - models/frontier_solution/
  max_changed_files: 20
  max_patch_bytes: 262144
evaluation:
  max_dev_submissions: 6
  suite_relation: same_distribution
  solver_visible_metrics:
  - development_mean_ordinary_quantized_png_psnr_db
  - development_mean_ema_quantized_png_psnr_db
  - development_mean_ordinary_quantized_png_lpips
  - development_mean_ema_quantized_png_lpips
  - development_mean_method_process_wall_seconds
