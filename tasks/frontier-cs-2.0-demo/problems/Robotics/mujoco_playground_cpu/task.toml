# The definition of mujoco_playground_cpu (schema frontier.task/v1, #757). Only what differs
# between tasks is here; tasks/shared/task-defaults.toml has the explicit defaults of the rest,
# and the category is this task's folder.
#
# GPU task: the Agent has one H100 runner (docker/agent-gpu.Dockerfile) and the Verifier runs
# the judge on one H100 (docker/verifier-gpu.Dockerfile) through the shared GPU adapter
# (docker/verifier.Dockerfile).
schema = "frontier.task/v1"
id = "mujoco_playground_cpu"
display_name = "Go1 Joystick Policy Training"
version = "go1-policy-training-gpu-20261011"

[agent]
cpu_millis = 3000
memory_bytes = 12884901888        # 12 GiB
workspace_bytes = 10737418240     # 10 GiB

[verifier]
cpu_millis = 3000
memory_bytes = 12884901888        # 12 GiB

[quota]
wall_time_seconds = 18000         # 5 h
max_train_calls = 3
max_train_wall_seconds = 16200
eval_timeout_seconds = 14400

[submission]
max_bytes = 262144
allowed_paths = ["frontier_solution/", "mujoco_playground/_src/locomotion/go1/joystick.py",
                 "mujoco_playground/_src/locomotion/go1/randomize.py",
                 "mujoco_playground/config/locomotion_params.py"]
max_changed_files = 50            # as before (the default)

[judge.config]                    # the evaluator's suite limits: train 5400 s, final 14400 s
runtime = { timeout_seconds = 5400, final_timeout_seconds = 14400 }

[gpu.agent]
allowed_types = ["H100"]
max_gpu_seconds = 14400
max_instance_seconds = 14400
max_instances = 1

[gpu.verifier]
max_gpu_instances = 1
max_gpu_seconds = 30600
lease_seconds = { train = 5400, eval = 14400 }   # runner lease per mode (the pool is 3 x train + 1 x eval)

[accelerator]
agent_gpu_interface = "frontier.gpu-helper/v3"
agent_sandbox = true
allowed_types = ["H100"]
credential_reaches_agent = false
provider = "driver-managed"
verifier_gpu = true

# SSH sessions to the GPU runners, per role (they must sum to max_ssh_sessions).
[network.audit]
max_ssh_bytes_per_direction = 8388608   # 8 MiB, as before
max_ssh_sessions = 48
ssh_session_budgets = { agent = 32, verifier_train = 12, verifier_eval = 4 }

[feedback]                        # train metrics besides beat_spec_progress; each a mean over the development workloads
development_mean_episode_reward = "Candidate policy's summed step reward until the first termination, mean over environments; mean over workloads."
development_mean_tracking_lin_vel = "Candidate policy's summed linear-velocity tracking reward term, mean over environments; mean over workloads."
development_mean_tracking_ang_vel = "Candidate policy's summed yaw-rate tracking reward term, mean over environments; mean over workloads."
development_mean_energy = "Candidate policy's per-alive-step energy penalty term (negative; closer to 0 is better); mean over workloads."
development_mean_action_rate = "Candidate policy's per-alive-step action-smoothness penalty term (negative; closer to 0 is better); mean over workloads."

[paper]                           # for readers; the platform never reads it
title = "Demonstrating MuJoCo Playground"
venue = "RSS 2025"
url = "https://arxiv.org/abs/2502.08844"
summary = "Train a Unitree Go1 joystick locomotion policy in MuJoCo Playground within a fixed GPU budget."
