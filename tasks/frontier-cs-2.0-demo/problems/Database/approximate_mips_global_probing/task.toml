# The definition of approximate_mips_global_probing (schema frontier.task/v1). Only what
# differs between tasks is here; tasks/shared/task-defaults.toml has the explicit defaults of
# the rest, and the category is this task's folder.
schema = "frontier.task/v1"
id = "approximate_mips_global_probing"
display_name = "FARGO paper-aligned query core"
version = "g2-audio-mnist-beat-spec-v3"

[agent]
cpu_millis = 4000
memory_bytes = 4294967296         # 4 GiB
workspace_bytes = 4294967296      # 4 GiB

[verifier]
cpu_millis = 4000
memory_bytes = 4294967296         # 4 GiB

[quota]
wall_time_seconds = 18000         # 5 h
max_train_calls = 50
max_train_wall_seconds = 18000
eval_timeout_seconds = 900

[submission]
max_bytes = 65536
allowed_paths = ["src/alg.cpp"]
max_changed_files = 1             # unchanged by the migration; the Agent sees it in submission-policy.json
# The judge's token denylist on src/alg.cpp (case-insensitive): the harness's metric marker and
# headers, since alg.cpp shares the measuring process. Data, ground truth, environment and the
# judge are out of reach of isolate the judge runs every build and run in.
forbidden_content = ["fargo_metric", "preprocess\\.h", "mf_alsh\\.h", "performance\\.h"]
ignore_case = true

# Agent-visible train metrics.
[feedback]
mean_recall = "Candidate recall averaged over the train operating points."
mean_ratio = "Candidate overall (mean rankwise inner-product) ratio averaged over the train operating points."
mean_kratio = "Candidate kth-result inner-product ratio averaged over the train operating points (diagnostic)."
mean_time_ms = "Candidate query time averaged over the train operating points, in milliseconds."
mean_candidates = "Candidate verified candidates per query averaged over the train operating points."

[paper]                           # for readers; the platform never reads it
title = "FARGO: Fast Maximum Inner Product Search via Global Multi-Probing"
venue = "PVLDB 2023"
url = "https://www.vldb.org/pvldb/vol16/p1100-zheng.pdf"
summary = "Rebuild FARGO's global multi-probing query core to beat the reference latency at equal recall."
