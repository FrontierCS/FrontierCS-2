# The definition of graph_mining_method_selection (schema frontier.task/v1). Only what
# differs between tasks is here; tasks/shared/task-defaults.toml has the explicit defaults of
# the rest, and the category is this task's folder.
schema = "frontier.task/v1"
id = "graph_mining_method_selection"
display_name = "Graph Mining Method Selection"
version = "g1-beat-spec-v1-agent5h-r2"

[agent]
cpu_millis = 8000
memory_bytes = 17179869184        # 16 GiB
workspace_bytes = 4294967296      # 4 GiB

[verifier]
cpu_millis = 8000
memory_bytes = 17179869184        # 16 GiB

[quota]
wall_time_seconds = 18000         # 5 h
max_train_calls = 100
max_train_wall_seconds = 90000
eval_timeout_seconds = 900

[submission]
max_bytes = 65536
allowed_paths = ["performance_model/src/main.py"]
max_changed_files = 1             # the statement says at most one file
allow_new_files = false

[feedback]
geomean_selected_runtime_seconds = "Geometric mean of the stored runtimes of the candidate-selected engines over the 112 train cases, in seconds."
max_selected_relative_error = "Largest stored relative error among the candidate-selected engine estimates."
cases = "Number of train cases evaluated."

[paper]                           # for readers; the platform never reads it
title = "Accurate and Fast Approximate Graph Pattern Mining at Scale"
venue = "PVLDB 2024"
url = "https://www.vldb.org/pvldb/vol18/p93-chen.pdf"
summary = "Choose and tune ScaleGPM's approximate graph-pattern mining engine per query to cut runtime within the error bound."
