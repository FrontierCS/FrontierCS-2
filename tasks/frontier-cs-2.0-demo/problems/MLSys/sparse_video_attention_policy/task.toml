# The definition of sparse_video_attention_policy (schema frontier.task/v1). Only what
# differs between tasks is here; tasks/shared/task-defaults.toml has the explicit defaults of
# the rest, and the category is this task's folder.
#
# GPU task: the Agent has one H100 runner (docker/agent-gpu.Dockerfile) and the Verifier runs
# the judge on four H100s (docker/verifier-gpu.Dockerfile), both with the shared GPU tools.
schema = "frontier.task/v1"
id = "sparse_video_attention_policy"
display_name = "Sparse Video Attention Policy"
version = "gpu-helper-v3-store-final-formal-v2"

[agent]
cpu_millis = 3000
memory_bytes = 12884901888        # 12 GiB
workspace_bytes = 10737418240     # 10 GiB

[verifier]
cpu_millis = 3000
memory_bytes = 12884901888        # 12 GiB
max_evidence_bytes = 4194304      # 4 MiB, as the previous release

[quota]
wall_time_seconds = 18000         # 5 h
max_train_calls = 25
max_train_wall_seconds = 225000
eval_timeout_seconds = 12600

[submission]
max_bytes = 262144
allowed_paths = ["svg/models/wan/attention.py", "svg/models/hyvideo/attention.py",
                 "svg/kmeans_utils.py", "svg/solver_extensions/"]
max_changed_files = 12            # unchanged by the migration

[feedback]                        # Agent-visible train metrics, in display order
e2e_latency_seconds = "Candidate latency per train workload, in seconds. Each metric list is sorted independently; positions match neither other metrics nor workloads."
psnr_db = "Candidate PSNR per train workload, in dB, sorted; an exact match is reported as \"positive_infinity\"."
ssim = "Candidate SSIM per train workload, sorted."
lpips = "Candidate LPIPS per train workload, sorted."

[gpu.agent]
allowed_types = ["H100"]
max_gpu_seconds = 54000
max_instance_seconds = 18000
max_instances = 1

[gpu.verifier]
max_gpu_instances = 4
max_gpu_seconds = 1310400

[accelerator]
agent_gpu_interface = "frontier.gpu-helper/v3"
agent_sandbox = true
allowed_types = ["H100"]
credential_reaches_agent = false
provider = "driver-managed"
verifier_gpu = true

# SSH sessions to the GPU runners, per role (they must sum to max_ssh_sessions).
[network.audit]
max_model_response_bytes = 8388608   # 8 MiB, as the previous release
max_ssh_sessions = 1076
ssh_session_budgets = { agent = 1024, verifier_train = 50, verifier_eval = 2 }

[paper]                           # for readers; the platform never reads it
title = "SVG-EAR: Parameter-Free Linear Compensation for Sparse Video Generation via Error-aware Routing"
venue = "ECCV 2026"
url = "https://arxiv.org/abs/2603.08982"
summary = "Design a sparse-attention policy for Sparse VideoGen text-to-video diffusion that preserves quality while reducing GPU time."
