{
  "edit_scope": {
    "allow_delete": false,
    "allow_empty": false,
    "allow_executable": false,
    "allow_new_files": true,
    "allowed_paths": [
      "src/alg.cpp"
    ],
    "allowed_suffixes": [],
    "deny_paths": [],
    "forbidden_added": [],
    "forbidden_content": [
      "fargo_metric",
      "preprocess\\.h",
      "mf_alsh\\.h",
      "performance\\.h"
    ],
    "ignore_case": true,
    "max_changed_files": 1,
    "max_patch_bytes": 65536
  },
  "evaluation": {
    "answering_timeout_seconds": 18000,
    "max_dev_submissions": 50,
    "max_metrics_bytes": 524288,
    "max_train_wall_seconds": 18000,
    "solver_visible_metrics": [
      "mean_recall",
      "mean_ratio",
      "mean_kratio",
      "mean_time_ms",
      "mean_candidates"
    ]
  },
  "runtime": {
    "timeout_seconds": 900
  }
}
