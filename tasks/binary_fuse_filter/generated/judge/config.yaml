{
  "edit_scope": {
    "allow_delete": false,
    "allow_empty": false,
    "allow_executable": true,
    "allow_new_files": true,
    "allowed_paths": [
      "include/"
    ],
    "allowed_suffixes": [],
    "deny_paths": [],
    "forbidden_added": [],
    "forbidden_content": [],
    "ignore_case": false,
    "max_changed_files": 32,
    "max_patch_bytes": 1048576
  },
  "evaluation": {
    "answering_timeout_seconds": 18000,
    "max_dev_submissions": 100,
    "max_metrics_bytes": 524288,
    "max_train_wall_seconds": 12000,
    "solver_visible_metrics": [
      "mean_resident_bytes",
      "mean_build_ns",
      "mean_lookup_ns",
      "mean_effective_fpr",
      "space_overhead_defined_workloads"
    ]
  },
  "runtime": {
    "timeout_seconds": 180
  }
}
